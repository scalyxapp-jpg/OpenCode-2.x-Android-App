name: Release

# Builds a signed release APK and attaches it to a GitHub Release when a tag
# like `v1.0.0` is pushed.
#
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of your .jks   (base64 -w0 release.jks)
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
#
# Without the secrets the job is skipped, so forks and PRs never fail here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured; skipping release build."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Clean up signing material
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f release.jks keystore.properties

      - name: Publish GitHub release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
