name: Release

# Builds a signed release APK and attaches it to a GitHub Release when a tag
# like `v1.0.0` is pushed.
#
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of your .jks   (base64 -w0 release.jks)
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
#
# Without the secrets the job is skipped, so forks and PRs never fail here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured; skipping release build."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify the tag matches the APK version
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Read the version straight out of the built APK, not from the source, so a
          # forgotten version bump is caught instead of silently publishing a
          # mislabelled release (and a stale versionCode blocks future updates).
          META=app/build/outputs/apk/release/output-metadata.json
          if [ ! -f "$META" ]; then
            echo "::error::$META missing — cannot verify the version."
            exit 1
          fi
          APK_VERSION="$(python3 -c "import json,sys; d=json.load(open('$META')); print(d['elements'][0]['versionName'])")"
          APK_CODE="$(python3 -c "import json,sys; d=json.load(open('$META')); print(d['elements'][0]['versionCode'])")"
          echo "tag=$TAG_VERSION apk=$APK_VERSION versionCode=$APK_CODE"
          if [ "$TAG_VERSION" != "$APK_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the APK versionName $APK_VERSION. Bump versionName/versionCode in app/build.gradle.kts before tagging."
            exit 1
          fi
          # versionCode is what Android uses to decide whether an update may be
          # installed: if it did not grow, the release cannot be installed over an
          # older one (the tag check above would not catch that).
          PREV_CODE="$(git show HEAD~1:app/build.gradle.kts 2>/dev/null | grep -oE 'versionCode = [0-9]+' | grep -oE '[0-9]+' | head -1 || true)"
          if [ -n "$PREV_CODE" ] && [ "$APK_CODE" -le "$PREV_CODE" ]; then
            echo "::error::versionCode $APK_CODE is not greater than the previous $PREV_CODE — the release would not install as an update."
            exit 1
          fi

      - name: Prepare release assets
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK=app/build/outputs/apk/release/app-release.apk
          # Versioned copy, so every release keeps its own identifiable file.
          cp "$APK" "OpenCode-Android-${VERSION}.apk"
          # Stable copy, so .../releases/latest/download/OpenCode-Android.apk
          # always resolves to the newest build (documented in the README).
          cp "$APK" "OpenCode-Android.apk"
          sha256sum OpenCode-Android.apk "OpenCode-Android-${VERSION}.apk"

      - name: Prepare release notes
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          # The notes live in the repository so they are versioned and reviewable.
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-body.md
            echo "release notes: $NOTES"
          else
            {
              echo "## ${GITHUB_REF_NAME}"
              echo
              echo "See [CHANGELOG.md](CHANGELOG.md) for the full list of changes."
            } > release-body.md
            echo "::warning::$NOTES not found; falling back to a minimal release body."
          fi
          # Append build-time checksums: the APK hash changes per build, so it
          # must not be hard-coded in the versioned notes file.
          {
            echo
            echo "---"
            echo
            echo "## Build artifacts"
            echo
            echo "Built from commit \`${GITHUB_SHA:0:7}\` by GitHub Actions."
            echo
            echo '```'
            sha256sum OpenCode-Android.apk "OpenCode-Android-${VERSION}.apk"
            echo '```'
          } >> release-body.md

      - name: Clean up signing material
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f release.jks keystore.properties

      - name: Publish GitHub release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # Release notes come from docs/releases/<tag>.md (see the step above).
          body_path: release-body.md
          files: |
            OpenCode-Android.apk
            OpenCode-Android-*.apk
