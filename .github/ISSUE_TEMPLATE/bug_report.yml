name: Bug report
description: Report a reproducible problem with the app
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do **not** paste secrets, tokens, private
        server URLs or conversation content — redact them.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is about the app, not the OpenCode server itself.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a session
        2. Send "..."
        3. Observe ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Visible in Settings, or the APK file name / commit SHA you built.
      placeholder: "1.0.0 / a1b2c3d"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version & device
      placeholder: "Android 14, Pixel 8"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: OpenCode server version
      placeholder: "e.g. 2.0.23"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: |
        `adb logcat -s OpenCodeApp OpenCodeCrash` or a screenshot. Remove anything private.
      render: text
    validations:
      required: false
