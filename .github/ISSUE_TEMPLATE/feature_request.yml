name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you want solved, not only the solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or pain point. Be concrete.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / streaming
        - Sessions & history
        - Tool calls & diffs
        - Permissions & questions
        - Models / providers
        - Notifications / widget / tile
        - Settings / theming
        - Other
    validations:
      required: true
